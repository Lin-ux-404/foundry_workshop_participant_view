name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  participant-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install --requirement requirements.lock
          python -m pip install pip-audit==2.10.1
      - name: Audit Python dependencies
        run: >-
          python -m pip_audit --requirement requirements.lock
          --no-deps --disable-pip
      - name: Validate participant boundary and notebooks
        run: python scripts/validate_participant_package.py
      - name: Run participant-safe tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q app labs scripts tests
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: app/frontend
        run: npm audit --audit-level=high
